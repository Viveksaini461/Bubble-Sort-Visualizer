<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact PlayZone - Send us your feedback or suggestions for new games.">
  <meta name="keywords" content="contact playzone, feedback, support">
  <meta name="author" content="PlayZone">
  <title>Contact Us - PlayZone</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="canonical" href="https://playzone.example/contact.html">

  <meta property="og:title" content="Contact PlayZone">
  <meta property="og:description" content="Send feedback or game suggestions to the PlayZone team.">
  <meta property="og:image" content="https://playzone.example/assets/og-image.svg">
  <meta property="og:url" content="https://playzone.example/contact.html">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0ea5e9">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact PlayZone",
    "url": "https://playzone.example/contact.html",
    "description": "Contact PlayZone for feedback and support."
  }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="PlayZone Logo" width="32" height="32">
        <span>PlayZone</span>
      </a>
      <nav class="nav">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/about.html">About</a>
        <a class="nav-link active" href="/contact.html">Contact</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
        <span class="toggle-icon" aria-hidden="true">☀️</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Contact Us</h1>
      <p>We love feedback. Use the form below to reach us. No backend is required—this is a demo form.</p>
    </section>

    <section>
      <form action="#" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>

        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" placeholder="Subject" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Type your message..." required></textarea>

        <button class="btn primary" type="submit" disabled title="Demo only">Send (disabled)</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="copyright">© <span id="year"></span> PlayZone. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/terms.html">Terms & Conditions</a>
        <a href="/contact.html">Contact Us</a>
      </nav>
    </div>
  </footer>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
