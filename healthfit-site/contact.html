<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact — HealthFit Guide</title>
	<meta name="description" content="Contact HealthFit Guide with feedback, partnership, or press inquiries.">
	<link rel="canonical" href="https://yourdomain.com/contact.html">
	<link rel="stylesheet" href="assets/css/styles.css">
	<script defer src="assets/js/app.js"></script>
</head>
<body>
	<div id="site-header"></div>
	<main class="container main">
		<h1>Contact</h1>
		<form id="suggest-form" class="form" novalidate>
			<div class="form-row">
				<label for="s-name">Name</label>
				<input id="s-name" class="input" type="text" placeholder="Your name">
			</div>
			<div class="form-row">
				<label for="s-email">Email</label>
				<input id="s-email" class="input" type="email" placeholder="you@example.com">
			</div>
			<div class="form-row">
				<label for="s-topic">Subject</label>
				<input id="s-topic" class="input" type="text" placeholder="Partnership, feedback, etc.">
			</div>
			<div class="form-row">
				<label for="s-details">Message</label>
				<textarea id="s-details" class="input" rows="6" placeholder="How can we help?"></textarea>
			</div>
			<button class="btn" type="submit">Send</button>
			<div id="suggest-msg" class="small" role="status" style="margin-top:8px;"></div>
		</form>
	</main>
	<div id="site-footer"></div>
</body>
</html>
